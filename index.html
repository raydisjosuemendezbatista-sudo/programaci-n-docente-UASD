<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Buscador de Materias UASD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8618977518134247"
     crossorigin="anonymous"></script>
<style>
  :root{
    --blue:#2F6FED;
    --blue-dark:#1E4FC4;
    --blue-soft:#E8F0FF;
    --ink:#1A2136;
    --muted:#6B7385;
    --bg:#F4F6FB;
    --card:#FFFFFF;
    --line:#E7EAF2;

    --virtual:#0EA894;
    --virtual-bg:#E3FBF6;
    --presencial:#2F6FED;
    --presencial-bg:#E8F0FF;
    --semi:#8B5CF6;
    --semi-bg:#F1EBFF;

    --gold:#FFB020;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold);color:#1A2136;}

  header{
    background:linear-gradient(155deg, var(--blue) 0%, var(--blue-dark) 100%);
    color:#fff;
    padding:28px 18px 22px;
    position:sticky;
    top:0;
    z-index:10;
    border-radius:0 0 26px 26px;
    box-shadow:0 8px 24px rgba(30,79,196,.25);
  }
  .badge-top{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.16);
    padding:5px 12px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.02em;
    margin-bottom:10px;
  }
  h1{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:23px;
    line-height:1.2;
    margin:0 0 4px;
    letter-spacing:-.01em;
  }
  .sub{
    font-size:13.5px;
    color:rgba(255,255,255,.82);
    margin:0 0 18px;
    font-weight:500;
  }
  .search-wrap{
    position:relative;
  }
  #q{
    width:100%;
    padding:15px 46px 15px 46px;
    border-radius:16px;
    border:none;
    background:#fff;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:15.5px;
    outline:none;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
  }
  #q::placeholder{color:#9AA1B2;}
  .search-wrap .icon-search{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:#9AA1B2;pointer-events:none;
  }
  .clear-btn{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;
    border:none;background:#EEF1F7;color:#8A93A6;
    font-size:14px;line-height:1;cursor:pointer;
    display:none;align-items:center;justify-content:center;
  }
  .clear-btn.show{display:flex;}

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
  }
  .chip{
    flex:0 0 auto;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    border:1.5px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .chip.active{
    background:#fff;
    border-color:#fff;
    color:var(--blue-dark);
  }
  .chip[data-mod="Virtual o por Internet"].active{color:var(--virtual);}
  .chip[data-mod="Presencial"].active{color:var(--presencial);}
  .chip[data-mod="Semi Presencial"].active{color:var(--semi);}

  select#campus, select#area{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 12px;
    border-radius:999px;
    border:1.5px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);
    color:#fff;
    flex:0 0 auto;
  }
  select#campus option, select#area option{color:#1A2136;}

  main{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 60px;
  }
  #results{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-content:flex-start;
  }
  .status{
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    margin:2px 6px 14px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 16px 14px;
    box-shadow:0 2px 10px rgba(20,30,60,.04);
    flex:1 1 320px;
    min-width:0;
  }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
  }
  .nrc-block{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .mod-icon{
    width:34px;height:34px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex:0 0 auto;
    background:var(--presencial-bg);
  }
  .mod-icon.virtual{background:var(--virtual-bg);}
  .mod-icon.semi{background:var(--semi-bg);}

  .nrc-text .nrc{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
    line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .nrc-text .clave{
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
  }
  .copy-btn{
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:700;
    border:none;
    background:var(--blue-soft);
    color:var(--blue-dark);
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .copy-btn:active{transform:scale(.96);}
  .copy-btn.copied{background:var(--virtual-bg);color:var(--virtual);}

  .asignatura{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:15.5px;
    margin:0 0 10px;
    line-height:1.3;
    color:var(--ink);
  }

  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
  }
  .badge{
    font-size:11.5px;
    font-weight:700;
    padding:4px 10px;
    border-radius:8px;
    background:var(--presencial-bg);
    color:var(--presencial);
  }
  .badge.virtual{background:var(--virtual-bg);color:var(--virtual);}
  .badge.semi{background:var(--semi-bg);color:var(--semi);}
  .badge.campus{background:var(--bg);color:var(--muted);}
  .badge.seccion{background:var(--bg);color:var(--muted);}
  .badge.tipo{background:#FFF3DC;color:#8A5A00;}

  .horarios{
    border-top:1px solid var(--line);
    padding-top:10px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .h-row{
    font-size:13px;
    font-weight:500;
    color:var(--ink);
    display:flex;
    gap:7px;
    align-items:baseline;
  }
  .h-row .t{font-size:13px;}

  .stats-row{
    display:flex;
    gap:10px;
    margin:4px 0 6px;
  }
  .stats-row{flex:1 1 100%;}
  .stat{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 8px;
    text-align:center;
  }
  .stat-num{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--blue-dark);
    line-height:1.1;
  }
  .stat-label{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    margin-top:2px;
  }

  .how-it-works{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-top:6px;
    flex:1 1 100%;
  }
  .how-title{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:14.5px;
    margin-bottom:12px;
    color:var(--ink);
  }
  .how-step{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13px;
    line-height:1.5;
    color:var(--ink);
    margin-bottom:10px;
  }
  .how-step:last-child{margin-bottom:0;}
  .how-num{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--blue-soft);
    color:var(--blue-dark);
    font-weight:800;
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }

  .empty, .hint{
    text-align:center;
    padding:22px 20px;
    color:var(--muted);
    flex:1 1 100%;
  }
  .empty{padding:50px 20px;}
  .empty .big, .hint .big{font-size:38px;margin-bottom:10px;}
  .hint p{font-size:14px;line-height:1.7;max-width:380px;margin:0 auto;}
  .hint b{color:var(--ink);}
  .quick-tags{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;
  }
  .quick-tag{
    font-size:12.5px;font-weight:700;
    background:var(--card);border:1px solid var(--line);
    color:var(--blue-dark);
    padding:7px 13px;border-radius:999px;
    cursor:pointer;
  }

  footer{
    max-width:720px;
    margin:0 auto;
    padding:14px 20px 40px;
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    line-height:1.7;
  }
  footer a{color:var(--blue);font-weight:600;text-decoration:none;}

  .cupos-btn{
    width:100%;
    margin-top:12px;
    padding:11px;
    border-radius:12px;
    border:none;
    background:var(--gold);
    color:#3D2600;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .cupos-btn:active{transform:scale(.98);}

  .load-more{
    display:block;
    width:100%;
    margin-top:6px;
    padding:14px;
    border-radius:14px;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--blue-dark);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    flex:1 1 100%;
  }

  /* ---------- Tablet / desktop ---------- */
  @media (min-width:640px){
    header{padding:30px 26px 26px;}
    h1{font-size:25px;}
  }
  @media (min-width:860px){
    header{padding:32px 30px 28px;border-radius:0 0 28px 28px;}
    .search-wrap, .filters, h1, .sub{max-width:820px;margin-left:auto;margin-right:auto;}
    .filters{flex-wrap:wrap;overflow-x:visible;}
    main{max-width:920px;padding:24px 20px 70px;}
    footer{max-width:920px;}
    .card{flex:1 1 340px;}
  }
  @media (min-width:1180px){
    .search-wrap, .filters, h1, .sub{max-width:1100px;}
    main{max-width:1180px;}
    footer{max-width:1180px;}
    #results{gap:18px;}
    .card{flex:1 1 30%;}
  }
</style>
</head>
<body>

<header>
  <span class="badge-top" id="periodBadge">🎓 UASD</span>
  <h1>Encuentra tu materia en segundos</h1>
  <p class="sub">Busca por código o nombre de la asignatura</p>
  <div class="search-wrap">
    <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="text" inputmode="search" autocomplete="off" placeholder="Ej. 28246, INF1030 o Física">
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>
  <div class="filters">
    <button class="chip active" data-mod="todas">✨ Todas</button>
    <button class="chip" data-mod="Presencial">🏫 Presencial</button>
    <button class="chip" data-mod="Semi Presencial">🔀 Semipresencial</button>
    <button class="chip" data-mod="Virtual o por Internet">💻 Virtual</button>
    <select id="campus"><option value="todos">📍 Todos los recintos</option></select>
    <select id="area"><option value="todas">📘 Todas las áreas</option></select>
  </div>
</header>

<main>
  <div class="status" id="status"></div>
  <div id="results"></div>
</main>

<footer>
  <span id="footerMeta">Fuente: Programación Docente oficial UASD</span><br>
  Verifica siempre en <a href="https://app.uasd.edu.do/ProgramacionPorAsignatura/" target="_blank">Autoservicio UASD</a> antes de inscribirte.<br>
  <a href="materias/index.html">Ver todas las materias (A-Z)</a>
</footer>

<script>
let RECORDS = [];
let CAMPUSES = [];
let META = {};

document.getElementById('status').textContent = 'Cargando materias...';

fetch('data.json')
  .then(r => {
    if(!r.ok) throw new Error('No se pudo cargar data.json');
    return r.json();
  })
  .then(payload => {
    RECORDS = payload.records;
    CAMPUSES = payload.campuses;
    META = payload.meta || {};
    window.AREAS = payload.areas || [];
    applyMeta();
    init();
  })
  .catch(err => {
    document.getElementById('results').innerHTML =
      '<div class="empty"><div class="big">⚠️</div><p>No se pudo cargar <b>data.json</b>.<br>Verifica que esté en la misma carpeta que este archivo y que lo estés viendo desde un servidor web (no abriendo el archivo directo).</p></div>';
    document.getElementById('status').textContent = '';
  });

function applyMeta(){
  const periodoDisplay = META.periodoDisplay || '';
  const periodoLabel = META.periodoLabel || '';
  const fecha = META.fechaEdicion || '';
  document.title = 'Buscador de Materias UASD' + (periodoDisplay ? ' — ' + periodoDisplay : '');
  document.getElementById('periodBadge').textContent = '🎓 UASD' + (periodoDisplay ? ' · Periodo ' + periodoDisplay : '');
  let footerText = 'Fuente: Programación Docente oficial UASD';
  if(periodoLabel) footerText += ', ' + periodoLabel;
  if(fecha) footerText += ' · editada ' + fecha;
  document.getElementById('footerMeta').textContent = footerText;
}

function init(){
const campusSel = document.getElementById('campus');
CAMPUSES.forEach(c=>{
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  campusSel.appendChild(o);
});
const areaSel = document.getElementById('area');
(window.AREAS || []).forEach(a=>{
  const o = document.createElement('option');
  o.value = a; o.textContent = a;
  areaSel.appendChild(o);
});

function normalize(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

RECORDS.forEach(r=>{
  r._search = normalize(r.n + ' ' + r.c + ' ' + r.a);
});

let state = { q:'', mod:'todas', campus:'todos', area:'todas', limit:40 };

const resultsEl = document.getElementById('results');
const statusEl = document.getElementById('status');
const qInput = document.getElementById('q');
const clearBtn = document.getElementById('clearBtn');

const urlParams = new URLSearchParams(window.location.search);
const initialQ = urlParams.get('q');
if(initialQ){
  qInput.value = initialQ;
  state.q = initialQ;
}

function modClass(m){
  if(m.indexOf('Virtual')===0) return 'virtual';
  if(m.indexOf('Semi')===0) return 'semi';
  return '';
}
function modLabel(m){
  if(m.indexOf('Virtual')===0) return 'Virtual';
  if(m.indexOf('Semi')===0) return 'Semipresencial';
  return 'Presencial';
}
function modIcon(m){
  if(m.indexOf('Virtual')===0) return '💻';
  if(m.indexOf('Semi')===0) return '🔀';
  return '🏫';
}
function tipoLabel(t){
  if(t==='TEO') return 'Teoría';
  if(t==='PRA') return 'Práctica';
  if(t==='LAB') return 'Laboratorio';
  return t;
}

function filterRecords(){
  const q = normalize(state.q.trim());
  let out = RECORDS;
  if(state.mod !== 'todas'){
    out = out.filter(r => r.m === state.mod);
  }
  if(state.campus !== 'todos'){
    out = out.filter(r => r.p === state.campus);
  }
  if(state.area !== 'todas'){
    out = out.filter(r => r.ar === state.area);
  }
  if(q.length > 0){
    out = out.filter(r => r._search.indexOf(q) !== -1);
  }
  return out;
}

function render(){
  const q = state.q.trim();
  clearBtn.classList.toggle('show', q.length > 0);

  if(q.length === 0 && state.mod==='todas' && state.campus==='todos' && state.area==='todas'){
    const nSubjects = new Set(RECORDS.map(r=>r.c)).size;
    const nSections = RECORDS.length;
    const nCampuses = CAMPUSES.length;
    resultsEl.innerHTML = `
    <div class="stats-row">
      <div class="stat"><div class="stat-num">${nSubjects.toLocaleString('es-DO')}</div><div class="stat-label">materias</div></div>
      <div class="stat"><div class="stat-num">${nSections.toLocaleString('es-DO')}</div><div class="stat-label">secciones</div></div>
      <div class="stat"><div class="stat-num">${nCampuses.toLocaleString('es-DO')}</div><div class="stat-label">recintos</div></div>
    </div>
    <div class="hint">
      <div class="big">📚</div>
      <p>Escribe un <b>código</b> (ej. INF1030) o el <b>nombre</b> de tu materia para empezar.</p>
      <div class="quick-tags">
        <button class="quick-tag" data-q="INF1030">INF1030</button>
        <button class="quick-tag" data-q="Física Básica">Física Básica</button>
        <button class="quick-tag" data-q="Lengua Española">Lengua Española</button>
      </div>
    </div>
    <div class="how-it-works">
      <div class="how-title">Cómo usarla</div>
      <div class="how-step"><span class="how-num">1</span><span>Busca tu materia por nombre o código, o filtra por modalidad, recinto o área.</span></div>
      <div class="how-step"><span class="how-num">2</span><span>Revisa el NRC, horario y días de cada sección disponible.</span></div>
      <div class="how-step"><span class="how-num">3</span><span>Toca <b>"Ver cupos y profesor en vivo"</b> para saber si aún hay espacio antes de inscribirte.</span></div>
    </div>`;
    statusEl.textContent = '';
    resultsEl.querySelectorAll('.quick-tag').forEach(t=>{
      t.addEventListener('click', ()=>{
        qInput.value = t.getAttribute('data-q');
        state.q = qInput.value;
        render();
      });
    });
    return;
  }
  const filtered = filterRecords();
  statusEl.textContent = filtered.length.toLocaleString('es-DO') + ' resultado' + (filtered.length===1?'':'s');

  if(filtered.length === 0){
    resultsEl.innerHTML = '<div class="empty"><div class="big">🔍</div><p>No encontramos nada con esos filtros.<br>Revisa el código o prueba con el nombre de la materia.</p></div>';
    return;
  }

  const shown = filtered.slice(0, state.limit);
  let html = '';
  shown.forEach(r=>{
    const mc = modClass(r.m);
    const ml = modLabel(r.m);
    const mi = modIcon(r.m);
    let horariosHtml = '';
    r.h.forEach(h=>{
      const horario = h[0] || 'Horario no especificado';
      const dias = h[1] ? ' · ' + h[1] : '';
      const aula = h[2] ? ' · Aula ' + h[2] : '';
      horariosHtml += '<div class="h-row"><span class="t">🕒</span><span>' + escapeHtml(horario+dias+aula) + '</span></div>';
    });
    html += `
    <div class="card">
      <div class="card-top">
        <div class="nrc-block">
          <div class="mod-icon ${mc}">${mi}</div>
          <div class="nrc-text">
            <div class="nrc">${r.n}</div>
            <div class="clave">${escapeHtml(r.c)}</div>
          </div>
        </div>
        <button class="copy-btn" data-nrc="${r.n}">Copiar</button>
      </div>
      <div class="asignatura">${escapeHtml(r.a)}</div>
      <div class="meta-row">
        <span class="badge ${mc}">${ml}</span>
        <span class="badge tipo">${tipoLabel(r.ty)}</span>
        <span class="badge campus">${escapeHtml(r.p)}</span>
        <span class="badge seccion">Sección ${escapeHtml(r.s)}</span>
      </div>
      <div class="horarios">${horariosHtml || '<div class="h-row"><span class="t">🕒</span><span>Horario no especificado</span></div>'}</div>
      <button class="cupos-btn" data-clave="${escapeHtml(r.c)}">🎟️ Ver cupos y profesor en vivo</button>
    </div>`;
  });

  if(filtered.length > state.limit){
    html += '<button class="load-more" id="loadMore">Ver más resultados (' + (filtered.length - state.limit).toLocaleString('es-DO') + ' restantes)</button>';
  }

  resultsEl.innerHTML = html;

  const lm = document.getElementById('loadMore');
  if(lm) lm.addEventListener('click', ()=>{ state.limit += 40; render(); });

  resultsEl.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const nrc = e.currentTarget.getAttribute('data-nrc');
      navigator.clipboard.writeText(nrc).then(()=>{
        e.currentTarget.textContent = '✓ Copiado';
        e.currentTarget.classList.add('copied');
        setTimeout(()=>{ e.currentTarget.textContent='Copiar'; e.currentTarget.classList.remove('copied'); }, 1400);
      });
    });
  });

  resultsEl.querySelectorAll('.cupos-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const clave = e.currentTarget.getAttribute('data-clave');
      const targetBtn = e.currentTarget;

      function fallbackCopy(text){
        try{
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        }catch(err){ return false; }
      }

      function afterCopy(success){
        if(success){
          targetBtn.textContent = '✓ Código "' + clave + '" copiado — pégalo en "Clave"';
        } else {
          targetBtn.textContent = '⚠️ Copia manual: ' + clave;
        }
        setTimeout(()=>{ targetBtn.textContent = '🎟️ Ver cupos y profesor en vivo'; }, 2600);
        window.open('https://app.uasd.edu.do/ProgramacionPorAsignatura/', '_blank');
      }

      if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
        navigator.clipboard.writeText(clave)
          .then(()=> afterCopy(true))
          .catch(()=> afterCopy(fallbackCopy(clave)));
      } else {
        afterCopy(fallbackCopy(clave));
      }
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let debounceTimer;
qInput.addEventListener('input', (e)=>{
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(()=>{
    state.q = e.target.value;
    state.limit = 40;
    render();
  }, 150);
});

clearBtn.addEventListener('click', ()=>{
  qInput.value = '';
  state.q = '';
  state.limit = 40;
  render();
  qInput.focus();
});

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    state.mod = chip.getAttribute('data-mod');
    state.limit = 40;
    render();
  });
});

campusSel.addEventListener('change', (e)=>{
  state.campus = e.target.value;
  state.limit = 40;
  render();
});

areaSel.addEventListener('change', (e)=>{
  state.area = e.target.value;
  state.limit = 40;
  render();
});

  render();
}
</script>
</body>
